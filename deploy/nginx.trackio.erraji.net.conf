# nginx site for https://trackio.erraji.net
#
# 1. DNS: add an A record  trackio.erraji.net → <your server's IP>  (AAAA too if you use IPv6)
# 2. sudo cp deploy/nginx.trackio.erraji.net.conf /etc/nginx/sites-available/trackio.erraji.net
#    sudo ln -s /etc/nginx/sites-available/trackio.erraji.net /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. HTTPS: sudo certbot --nginx -d trackio.erraji.net
#    (certbot adds the 443 block and the http → https redirect to this file)
server {
    listen 80;
    listen [::]:80;
    server_name trackio.erraji.net;

    location / {
        proxy_pass http://127.0.0.1:3001;   # same PORT as deploy/ecosystem.config.cjs
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/xml;
}
